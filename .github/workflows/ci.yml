# Every push: lint → tests (with a real Postgres) → manifests → image → scan.
# Images are pushed to GHCR by commit SHA, from main only (never `latest` in prod).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: driftops
          POSTGRES_PASSWORD: driftops
          POSTGRES_DB: driftops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driftops" --health-interval 5s --health-retries 10
    env:
      DRIFTOPS_TEST_DB_URL: postgresql://driftops:driftops@localhost:5432/driftops
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          for env in dev prod; do
            helm lint deploy/helm/driftops -f deploy/helm/driftops/values-$env.yaml --set image.tag=ci
            helm template driftops deploy/helm/driftops -f deploy/helm/driftops/values-$env.yaml --set image.tag=ci \
              | ./kubeconform -strict -summary
          done

  image:
    runs-on: ubuntu-latest
    needs: [python, manifests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: driftops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: docker run --rm driftops:ci --help
      - name: Trivy (fail on critical)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: driftops:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag driftops:ci ghcr.io/${{ github.repository_owner }}/driftops:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/driftops:${{ github.sha }}
