apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "driftops.labels" . | nindent 4 }}
data:
  01-mlflow.sql: |
    -- MLflow's backend store lives next to DriftOps' tables, in its own database (ADR-0012).
    CREATE DATABASE mlflow OWNER driftops;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "driftops.labels" . | nindent 4 }}
spec:
  selector: {{- include "driftops.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
    {{- if .Values.observability.enabled }}
    - {name: metrics, port: 9187, targetPort: metrics}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "driftops.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "driftops.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "driftops.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70         # the postgres user in the alpine image
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: driftops}
            - {name: POSTGRES_DB, value: driftops}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-secrets, key: db-password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "driftops", "-d", "driftops"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "driftops", "-d", "driftops"]}
            periodSeconds: 15
            failureThreshold: 6
          startupProbe:
            exec: {command: ["pg_isready", "-U", "driftops", "-d", "driftops"]}
            periodSeconds: 3
            failureThreshold: 60
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
        {{- if .Values.observability.enabled }}
        # Sidecar: shares the pod's network, reads Postgres' own statistics on localhost and
        # exposes them to Prometheus, without changing the database container at all.
        - name: postgres-exporter
          image: {{ .Values.observability.postgresExporterImage }}
          env:
            - {name: DATA_SOURCE_URI, value: "localhost:5432/driftops?sslmode=disable"}
            - {name: DATA_SOURCE_USER, value: driftops}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-secrets, key: db-password}
          ports:
            - {name: metrics, containerPort: 9187}
          livenessProbe:
            httpGet: {path: /, port: metrics}
            periodSeconds: 30
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsUser: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        {{- end }}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: init
          configMap: {name: {{ .Release.Name }}-postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
