{{- if .Values.observability.enabled }}
{{- /* Dashboards as code: generated by scripts/build_dashboards.py, discovered by Grafana's
       sidecar through the grafana_dashboard label. Edit the generator, not the JSON. */ -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    {{- include "driftops.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
