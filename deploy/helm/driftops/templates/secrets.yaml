{{- /*
Generated once, then kept: across upgrades (lookup) and across uninstall (resource-policy), so
the passwords always match the Postgres volume, which outlives both. The Grafana datasource is
rendered here too, from the same variable: two templates would each roll their own random value.
*/ -}}
{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if $existing -}}{{- $data = $existing.data -}}{{- end -}}
{{- $db := get $data "db-password" | default (randAlphaNum 32 | b64enc) -}}
{{- $sim := get $data "sim-token" | default (randAlphaNum 40 | b64enc) -}}
{{- $grafana := get $data "grafana-db-password" | default (randAlphaNum 32 | b64enc) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "driftops.labels" . | nindent 4 }}
  annotations:
    # The Postgres volume outlives `helm uninstall` (StatefulSet volumes always do), so the
    # passwords for it must too: a regenerated password locks every pod out of the old data.
    helm.sh/resource-policy: keep
type: Opaque
data:
  db-password: {{ $db }}
  sim-token: {{ $sim }}
  grafana-db-password: {{ $grafana }}
{{- if .Values.observability.enabled }}
---
# Discovered by Grafana's sidecar (label grafana_datasource) from any namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-datasources
  labels:
    {{- include "driftops.labels" . | nindent 4 }}
    grafana_datasource: "1"
type: Opaque
stringData:
  driftops.yaml: |
    apiVersion: 1
    datasources:
      - name: DriftOps Postgres
        uid: driftops-postgres
        type: grafana-postgresql-datasource
        url: {{ .Release.Name }}-postgres.{{ .Release.Namespace }}.svc.cluster.local:5432
        user: grafana_ro
        jsonData:
          database: driftops
          sslmode: disable
          postgresVersion: 1700
          maxOpenConns: 5
        secureJsonData:
          password: {{ $grafana | b64dec | quote }}
      - name: Loki
        uid: loki
        type: loki
        url: {{ .Values.observability.lokiUrl }}
{{- end }}
