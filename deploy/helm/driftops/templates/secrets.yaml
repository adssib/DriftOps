{{- /* Generated once, then kept across upgrades (lookup), so pods and data stay in step. */ -}}
{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "driftops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  db-password: {{ index $existing.data "db-password" }}
  sim-token: {{ index $existing.data "sim-token" }}
  {{- else }}
  db-password: {{ randAlphaNum 32 | b64enc }}
  sim-token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
