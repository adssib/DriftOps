[project]
name = "driftops"
version = "0.1.0"
description = "Closed-loop MLOps on Kubernetes: drift detection, guarded retraining, canary rollout."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "mlflow>=3.0",
  "structlog>=24.0",
  "prometheus-client>=0.20",
  "httpx>=0.27",
]

[project.scripts]
driftops = "driftops.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# BTS times are airport-local with no zone; tests build them the same way the data has them.
"tests/*" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
